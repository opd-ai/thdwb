<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breaking News - Example News</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; color: #333; }
  header { background: #2c3e50; color: white; padding: 1rem; }
  nav { display: flex; gap: 1rem; }
  nav a { color: white; text-decoration: none; }
  .container { max-width: 800px; margin: 0 auto; padding: 1rem; }
  article { line-height: 1.6; }
  h1 { font-size: 2rem; margin-bottom: 1rem; }
  .meta { color: #666; font-size: 0.9rem; }
  img { max-width: 100%; height: auto; }
  footer { background: #f1f1f1; padding: 1rem; margin-top: 2rem; }
</style>
</head>
<body>
<header>
  <nav>
    <a href="/">Home</a>
    <a href="/world">World</a>
    <a href="/tech">Technology</a>
  </nav>
</header>
<div class="container">
  <article>
    <h1>Breaking News: Major Event Occurs</h1>
    <div class="meta">Published: 2026-10-30 | By: Staff Writer</div>
    <img src="/images/news.jpg" alt="News image">
    <p>This is a breaking news article about a major event that just occurred.</p>
    <p>Details are still developing as more information becomes available.</p>
  </article>
</div>
<footer>
  <p>&copy; 2026 Example News. All rights reserved.</p>
</footer>
</body>
</html>

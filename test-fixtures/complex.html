<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Complex Page</title>
	<style>
		body { margin: 0; font-family: Arial, sans-serif; }
		header { background: #222; color: #fff; padding: 16px; }
		nav a { color: #fff; margin-right: 12px; }
		main { padding: 24px; }
		.card { border: 1px solid #ddd; padding: 12px; margin-bottom: 16px; }
		table { border-collapse: collapse; }
		td, th { border: 1px solid #999; padding: 6px 10px; }
		footer { background: #eee; padding: 8px; font-size: 12px; }
	</style>
</head>
<body>
	<header>
		<h1>Site Title</h1>
		<nav>
			<a href="#">Home</a>
			<a href="#">About</a>
			<a href="#">Contact</a>
		</nav>
	</header>
	<main>
		<section class="card">
			<h2>Section One</h2>
			<p>Some content describing the first section of a realistic web page.</p>
			<ul>
				<li>First item</li>
				<li>Second item</li>
				<li>Third item</li>
			</ul>
		</section>
		<section class="card">
			<h2>Section Two</h2>
			<table>
				<tr><th>Name</th><th>Value</th></tr>
				<tr><td>Width</td><td>900</td></tr>
				<tr><td>Height</td><td>600</td></tr>
			</table>
		</section>
	</main>
	<footer>&copy; 2025 Example Corp. All rights reserved.</footer>
</body>
</html>

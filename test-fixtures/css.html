<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>CSS Page</title>
	<style>
		body {
			background-color: #f0f0f0;
			font-family: sans-serif;
		}
		h1 {
			color: #cc3300;
			font-size: 32px;
		}
		p {
			margin: 10px;
			padding: 4px;
			color: #333333;
		}
		.highlight {
			background-color: #ffffcc;
			border: 1px solid #cccccc;
		}
	</style>
</head>
<body>
	<h1>Styled Headings</h1>
	<p class="highlight">A paragraph with a class selector and box styles.</p>
	<p style="color: #0000ff;">An inline-styled paragraph.</p>
</body>
</html>

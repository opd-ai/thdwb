<!doctype html>
<html lang="en"><meta charset="utf-8">
<title>Complex Nested Flexbox Test</title>
<style>
  .flex-container {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 100px;
    padding: 10px;
  }
  .flex-item {
    width: 50px;
    height: 50px;
    background-color: blue;
  }
</style>
<body>
  <div class="flex-container">
    <div class="flex-item">Item 1</div>
    <div class="flex-item">Item 2</div>
    <div class="flex-item">Item 3</div>
  </div>
</body>
</html>
